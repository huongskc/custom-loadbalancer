version: "3.8"

services:
  mock-cluster:
    image: python:3.11-slim
    container_name: t22-mock-cluster
    working_dir: /app
    volumes:
      - ./:/app/mock
      - ../requirements.txt:/app/requirements.txt
    command: >
      sh -c "pip install --no-cache-dir -r /app/requirements.txt &&
             python /app/mock/mock_servers.py"
    ports:
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
    restart: unless-stopped
